name: android
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Debug APK (for testing on a phone)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: ksn-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
      - name: Put the test APK where a phone can download it
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk $RUNNER_TEMP/ksn-test.apk
          git fetch -q origin media && git worktree add -q $RUNNER_TEMP/media origin/media
          cd $RUNNER_TEMP/media && git checkout -q -B media
          mkdir -p app && cp $RUNNER_TEMP/ksn-test.apk app/ksn-test.apk
          git config user.name ksn-bot && git config user.email bot@keepseeingnumbers.com
          git add app/ksn-test.apk && git commit -q -m "Test APK build ${GITHUB_RUN_NUMBER}" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin media && git push -q origin media && break; sleep 5; done
      - name: Release bundle (for Google Play), only when signing secrets exist
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: android
        env:
          KSN_KEYSTORE_PASSWORD: ${{ secrets.KSN_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.KSN_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/ksn.jks
          KSN_KEYSTORE=$RUNNER_TEMP/ksn.jks ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEY == 'true' }}
        with: { name: ksn-release-aab, path: android/app/build/outputs/bundle/release/*.aab }
    env:
      HAS_KEY: ${{ secrets.KSN_KEYSTORE_B64 != '' }}
