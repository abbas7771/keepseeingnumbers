name: android
on:
  push:
    branches: [android]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Debug APK (for testing on a phone)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: ksn-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
      - name: Release bundle (for Google Play), only when signing secrets exist
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: android
        env:
          KSN_KEYSTORE_PASSWORD: ${{ secrets.KSN_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.KSN_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/ksn.jks
          KSN_KEYSTORE=$RUNNER_TEMP/ksn.jks ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEY == 'true' }}
        with: { name: ksn-release-aab, path: android/app/build/outputs/bundle/release/*.aab }
    env:
      HAS_KEY: ${{ secrets.KSN_KEYSTORE_B64 != '' }}
