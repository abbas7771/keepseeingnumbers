name: angels-daily
# Publishes angel-number pages whose publish date has arrived (10 per day).
on:
  schedule:
    - cron: "7 0 * * *"   # 04:07 Baku
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_angels.py
      - run: |
          git config user.name "ksn-bot"
          git config user.email "bot@keepseeingnumbers.com"
          git add angel-numbers sitemap.xml
          git diff --cached --quiet || (git commit -m "Publish scheduled angel numbers ($(date -u +%F))" && git push)
