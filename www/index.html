<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep Seeing Numbers App: Angel Numbers, Life Path & 2027</title>
<meta name="description" content="Free app: look up any angel number, find your Life Path number and your 2027 Personal Year. Install it on your phone in one tap.">
<meta name="theme-color" content="#0a0806">
<meta name="color-scheme" content="dark only">
<meta name="supported-color-schemes" content="dark">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark only;--bg:#0a0806;--card:#16120d;--line:rgba(255,214,120,.38);--gold:#ffe680;--ink:#ffffff;--mute:#eadfc9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 20px 6px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;letter-spacing:3px;font-size:12px;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.logo i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);display:inline-block}
#install{display:none;border:1px solid var(--gold);color:var(--gold);background:none;border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;font-weight:700}
main{padding:10px 20px 20px;max-width:560px;margin:0 auto}
.view{display:none}.view.on{display:block}
h1{font-family:"Cormorant Garamond",serif;font-size:34px;line-height:1.1;margin:10px 0 6px}
h1 em{color:var(--gold);font-style:normal;text-shadow:0 0 16px rgba(255,220,110,.35)}
.sub{color:var(--mute);font-size:15px;line-height:1.5;margin-bottom:16px}
.search{display:flex;gap:8px}
input,select{background:#1b1610;border:1px solid rgba(255,204,102,.45);color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;font-size:17px;width:100%}
.btn{border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:800;letter-spacing:1px;color:#1a1206;background:#ffc94d;background-image:linear-gradient(90deg,#ffe08a,#ffb340);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.w{width:100%;margin-top:12px}
.lock{margin-top:14px;padding:16px;border:1px dashed var(--line);border-radius:16px;text-align:center}.lock p{margin:0 0 10px;color:var(--mute);font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--gold);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.big{font-family:"Cormorant Garamond",serif;font-size:64px;color:var(--gold);line-height:1}
.tag{display:inline-block;font-size:10px;letter-spacing:3px;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:4px 10px;margin:8px 0 10px}
.card p{line-height:1.65;font-size:16px;color:#f4efe7;margin-bottom:10px}
.card h3{font-size:14px;letter-spacing:2px;color:var(--gold);font-weight:800;margin:14px 0 6px;text-transform:uppercase}
.card ol{margin:0 0 6px 20px;line-height:1.65;color:#f4efe7;font-size:16px}
details{border-top:1px solid rgba(255,255,255,.08);padding:10px 0}
summary{cursor:pointer;font-weight:600;font-size:14px}
details p{margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#fff;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.kv span:first-child{color:#f0d9a0;font-weight:600}
.more{color:var(--gold);font-weight:800;text-shadow:0 0 12px rgba(255,220,110,.35);text-decoration:none;display:inline-block;margin-top:8px}
.row{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:8px}
.res{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:6px}
.res div{text-align:center;background:#000;border:1px solid var(--line);border-radius:16px;padding:12px 6px}
.res b{display:block;font-family:"Cormorant Garamond",serif;font-size:42px;color:var(--gold);text-shadow:0 0 14px rgba(255,220,110,.4)}
.res span{font-size:12px;color:#fff;letter-spacing:1px}
.err{color:#ff8a7a;font-size:13px;margin-top:8px;min-height:16px}
ul.ck{list-style:none;margin:10px 0}
ul.ck li{padding:6px 0 6px 24px;position:relative;font-size:15px;color:#f4efe7}
ul.ck li:before{content:"✦";position:absolute;left:0;color:var(--gold)}
.note{font-size:13px;color:var(--mute);margin-top:12px;line-height:1.5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,8,6,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px)}
nav.tabs button{flex:1;background:none;border:0;color:#efe6d6;font:inherit;font-size:11px;font-weight:700;letter-spacing:1px;padding:12px 0 14px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button b{font-size:20px;font-family:"Cormorant Garamond",serif}
nav.tabs button.on{color:var(--gold)}
#ios{display:none}
</style>
</head>
<body>
<header><span class="logo"><i></i>KEEP SEEING NUMBERS</span></header>
<main>

<section class="view on" id="v-num">
  <h1>Keep seeing a <em>number?</em></h1>
  <p class="sub">Type it below. Times work too, like 11:11.</p>
  <form class="search" id="f-num"><input id="q" inputmode="numeric" autocomplete="off" placeholder="e.g. 444 or 17:17" aria-label="Number"><button class="btn" type="submit">Go</button></form>
  <div class="chips" id="chips"></div>
  <div id="out"></div>
  
</section>

<section class="view" id="v-me">
  <h1>Your <em>numbers</em></h1>
  <p class="sub">Enter your birthday once. It stays on this phone only.</p>
  <div class="row"><select id="bd" aria-label="Day"></select><select id="bm" aria-label="Month"></select><input id="by" inputmode="numeric" placeholder="Year" aria-label="Year" maxlength="4"></div>
  <button class="btn w" id="calc">Show my numbers</button>
  <div class="err" id="merr"></div>
  <div id="mine"></div>
</section>



</main>
<nav class="tabs">
  <button class="on" data-v="v-num"><b>111</b>NUMBERS</button>
  <button data-v="v-me"><b>✦</b>MY NUMBERS</button>
</nav>

<script src="quick.js"></script>
<script src="app.js"></script>
</body>
</html>
